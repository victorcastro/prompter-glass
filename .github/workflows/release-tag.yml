name: Release tag

# Tags main with the version the project declares, once per version. The tag is what the
# changelog links point at, and what an App Store submission can be traced back to.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-tag
  cancel-in-progress: false

jobs:
  tag:
    name: Tag the released version
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      # The pull request checks read the version through this same action, so the two cannot
      # drift apart. They run again here because pushes straight to main skip the pull request.
      - name: Read the declared version
        id: version
        uses: ./.github/actions/declared-version

      - name: Tag it, unless that version is already tagged
        run: |
          version="${{ steps.version.outputs.version }}"
          tag="v$version"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            echo "$tag already exists; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" -m "PrompterGlass $version"
          git push origin "$tag"
          echo "Created $tag at $(git rev-parse --short HEAD)."
