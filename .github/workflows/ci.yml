name: CI

on:
  pull_request:
    branches: [main]

env:
  SWIFTLINT_IMAGE: ghcr.io/realm/swiftlint:0.63.2

permissions:
  contents: read

concurrency:
  group: pr-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: SwiftLint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: SwiftLint
        run: |
          docker run --rm \
            -v "$PWD:/work" -w /work \
            --entrypoint swiftlint \
            "$SWIFTLINT_IMAGE" \
            lint --strict --reporter github-actions-logging

  sanity:
    name: Repo sanity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Shared scheme exists
        run: |
          test -d PrompterGlass.xcodeproj/xcshareddata/xcschemes \
            || { echo "::error::No shared schemes found; a macOS CI job would not be able to build the project"; exit 1; }

      - name: Xcode project parses
        run: |
          grep -q "objectVersion" PrompterGlass.xcodeproj/project.pbxproj \
            || { echo "::error::project.pbxproj is corrupted"; exit 1; }

      - name: No temporary entitlement exceptions
        run: |
          if grep -n "temporary-exception" PrompterGlass.entitlements; then
            echo "::error::Temporary entitlement exceptions are rejected by App Review (guideline 2.4.5); remove the key above"
            exit 1
          fi

      - name: App Sandbox stays enabled
        run: |
          grep -q "com.apple.security.app-sandbox" PrompterGlass.entitlements \
            || { echo "::error::The App Sandbox entitlement is missing"; exit 1; }

      - name: No merge conflict markers
        run: |
          if grep -rIn --exclude-dir=.git -E '^(<<<<<<<|>>>>>>>) ' .; then
            echo "::error::Unresolved merge conflict markers"
            exit 1
          fi

  version:
    name: Version
    runs-on: ubuntu-latest

    # Always runs, and decides internally whether the gate applies. Filtering the job with
    # `paths:` would leave documentation-only pull requests never reporting this check, which
    # blocks them forever once it is a required status check.
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Does this pull request change the app?
        id: scope
        run: |
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "Changed files:"
          printf '%s\n' "$changed" | sed 's/^/  /'
          if printf '%s\n' "$changed" | grep -qE '^(PrompterGlass/|PrompterGlass\.xcodeproj/|PrompterGlass\.entitlements$)'; then
            echo "applies=true" >> "$GITHUB_OUTPUT"
          else
            echo "applies=false" >> "$GITHUB_OUTPUT"
            echo "No app sources touched; the version gate does not apply."
          fi

      - name: Read the declared version
        id: declared
        if: steps.scope.outputs.applies == 'true'
        uses: ./.github/actions/declared-version

      - name: That version must not be released already
        if: steps.scope.outputs.applies == 'true'
        run: |
          version="${{ steps.declared.outputs.version }}"
          if [ -n "$(git ls-remote --tags origin "refs/tags/v$version")" ]; then
            echo "::error::Version $version is already released as tag v$version. Raise MARKETING_VERSION and add a '## [<new version>]' entry to CHANGELOG.md."
            exit 1
          fi
          echo "Version $version is unreleased; v$version will be tagged when this merges."
