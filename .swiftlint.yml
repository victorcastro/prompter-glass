included:
  - PrompterGlass
  - PrompterGlassTests
  - PrompterGlassUITests
  - Source

excluded:
  - .build
  - DerivedData
  - PrompterGlass.xcodeproj

disabled_rules:
  - trailing_comma
  - todo

opt_in_rules:
  - empty_count
  - empty_string
  - first_where
  - last_where
  - contains_over_first_not_nil
  - toggle_bool
  - unneeded_parentheses_in_closure_argument
  - redundant_nil_coalescing
  - closure_spacing
  - explicit_init
  - joined_default_parameter
  - literal_expression_end_indentation
  - operator_usage_whitespace
  - sorted_first_last
  - unavailable_function
  - vertical_parameter_alignment_on_call
  - yoda_condition

line_length:
  warning: 120
  error: 160
  ignores_comments: true
  ignores_urls: true

type_body_length:
  warning: 300
  error: 450

file_length:
  warning: 500
  error: 800
  ignore_comment_only_lines: true

function_body_length:
  warning: 60
  error: 100

cyclomatic_complexity:
  warning: 12
  error: 20

identifier_name:
  min_length:
    warning: 2
  excluded:
    - id
    - x
    - y
    - dx
    - dy

nesting:
  type_level: 2

reporter: xcode
