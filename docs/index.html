<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrompterGlass — macOS teleprompter</title>
  <meta name="description" content="A native macOS teleprompter with a transparent floating overlay that stays on top of any app.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site">
    <h1>PrompterGlass</h1>
    <p class="tagline">A native macOS teleprompter with a transparent floating window that stays on top of any app — read your script right next to the webcam during recordings and video calls.</p>
  </header>

  <nav class="site">
    <a href="https://github.com/victorcastro/prompter-glass">GitHub</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms</a>
    <a href="https://github.com/victorcastro/prompter-glass/blob/main/CHANGELOG.md">Changelog</a>
    <a href="https://github.com/victorcastro/prompter-glass/issues">Report an issue</a>
  </nav>

  <main class="wide">
    <figure>
      <img src="images/tab-prompter.png" alt="Prompter tab with the glass panel preview, voice tracking and click-through toggles, and speed, text size and backdrop controls">
      <figcaption>The Prompter tab: pick your script, tune speed, text size and backdrop, then hit Roll.</figcaption>
    </figure>

    <figure>
      <img src="images/tab-library.png" alt="Library tab showing script cards with word counts, read times and a New script button">
      <figcaption>The Library: your scripts as cards, with word counts and estimated read time.</figcaption>
    </figure>

    <figure>
      <img src="images/tab-my_activity.png" alt="My activity tab with delivery pace, time on air and retakes avoided metrics for the last 30 days">
      <figcaption>My activity: delivery pace, time on air and retakes avoided over the last 30 days.</figcaption>
    </figure>

    <figure>
      <img src="images/prompter.png" alt="Transparent floating overlay rolling a script in large text with voice tracking highlighting the words being read">
      <figcaption>The floating overlay — transparent, always on top, with voice tracking highlighting your words as you read.</figcaption>
    </figure>
  </main>

  <footer class="site">
    Open source under the <a href="https://github.com/victorcastro/prompter-glass/blob/main/LICENSE">MIT License</a> · © 2026 Victor Castro
  </footer>
</body>
</html>
