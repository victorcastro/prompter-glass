<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PrompterGlass — macOS teleprompter</title>
  <meta name="description" content="A native macOS teleprompter with a transparent floating overlay that stays on top of any app.">
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <header class="site">
    <h1>PrompterGlass</h1>
    <p class="tagline">A native macOS teleprompter with a transparent floating window that stays on top of any app — read your script right next to the webcam during recordings and video calls.</p>
  </header>

  <nav class="site">
    <a href="https://github.com/victorcastro/prompter-glass">GitHub</a>
    <a href="privacy.html">Privacy Policy</a>
    <a href="terms.html">Terms</a>
    <a href="https://github.com/victorcastro/prompter-glass/blob/main/CHANGELOG.md">Changelog</a>
    <a href="https://github.com/victorcastro/prompter-glass/issues">Report an issue</a>
  </nav>

  <main class="wide">
    <figure>
      <img src="images/main-window.png" alt="Main window with the script editor, playback controls and appearance settings">
      <figcaption>The main window: write your scripts, control playback and appearance.</figcaption>
    </figure>

    <figure>
      <img src="images/overlay.png" alt="Transparent overlay showing a script in large green text over the desktop">
      <figcaption>The floating overlay — transparent, always on top, readable over anything.</figcaption>
    </figure>
  </main>

  <footer class="site">
    Open source under the <a href="https://github.com/victorcastro/prompter-glass/blob/main/LICENSE">MIT License</a> · © 2026 Victor Castro
  </footer>
</body>
</html>
